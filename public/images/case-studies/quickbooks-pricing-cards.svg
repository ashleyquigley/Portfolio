  <line x1="340" y1="372" x2="340" y2="397" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="372" x2="540" y2="397" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- rendered pricing cards: same skeleton, local accent + copy -->
  <g>
    <rect x="55" y="400" width="170" height="214" rx="16" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
    <rect x="69" y="416" width="142" height="30" rx="8" fill="#E7C7EE"/>
    <text x="140" y="436" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14132B" text-anchor="middle">CA pricing</text>
    <text x="140" y="482" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#14132B" text-anchor="middle">$45/mo</text>
    <rect x="69" y="504" width="142" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="69" y="522" width="116" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="69" y="540" width="130" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="69" y="584" width="142" height="30" rx="15" fill="#14132B"/>
    <text x="140" y="604" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get started</text>
  </g>

  <g>
    <rect x="255" y="400" width="170" height="214" rx="16" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
    <rect x="269" y="416" width="142" height="30" rx="8" fill="#B1FF9E"/>
    <text x="340" y="436" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14132B" text-anchor="middle">AU pricing</text>
    <text x="340" y="482" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#14132B" text-anchor="middle">$35/mo</text>
    <rect x="269" y="504" width="142" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="269" y="522" width="116" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="269" y="540" width="130" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="269" y="584" width="142" height="30" rx="15" fill="#14132B"/>
    <text x="340" y="604" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get started</text>
  </g>

  <g>
    <rect x="455" y="400" width="170" height="214" rx="16" fill="#FFFFFF" stroke="#E4E1F2" stroke-width="1.5"/>
    <rect x="469" y="416" width="142" height="30" rx="8" fill="#D9DEFF"/>
    <text x="540" y="436" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14132B" text-anchor="middle">UK pricing</text>
    <text x="540" y="482" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#14132B" text-anchor="middle">£22/mo</text>
    <rect x="469" y="504" width="142" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="469" y="522" width="116" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="469" y="540" width="130" height="9" rx="4.5" fill="#EDEAF5"/>
    <rect x="469" y="584" width="142" height="30" rx="15" fill="#14132B"/>
    <text x="540" y="604" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get started</text>
  </g>

  <!-- legend -->
  <rect x="190" y="656" width="14" height="14" rx="3" fill="#B1FF9E" stroke="#14132B" stroke-width="0.6"/>
  <text x="212" y="667" font-family="Arial, sans-serif" font-size="11" fill="#5C5A72">Shared logic — one base component</text>
  <rect x="190" y="680" width="14" height="14" rx="3" fill="#F4C9F3" stroke="#14132B" stroke-width="0.6"/>
  <text x="212" y="691" font-family="Arial, sans-serif" font-size="11" fill="#5C5A72">Market packages — local presentation only</text>
</svg>
