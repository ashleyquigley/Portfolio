<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14132B"/>
    </marker>
  </defs>

  <rect width="680" height="780" fill="#FFFFFF"/>

  <text x="340" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6" fill="#8B899C" text-anchor="middle">ILLUSTRATIVE MONOREPO STRUCTURE</text>

  <!-- root package -->
  <rect x="250" y="58" width="180" height="48" rx="12" fill="#14132B"/>
  <text x="340" y="87" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">packages/pricing-cards</text>

  <line x1="340" y1="106" x2="340" y2="141" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- base component -->
  <rect x="210" y="144" width="260" height="98" rx="14" fill="#B1FF9E" stroke="#14132B" stroke-width="1.5"/>
  <text x="340" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14132B" text-anchor="middle">pricing-card-base/</text>
  <text x="340" y="198" font-family="Arial, sans-serif" font-size="11.5" fill="#14132B" text-anchor="middle">shared logic: pricing calc,</text>
  <text x="340" y="214" font-family="Arial, sans-serif" font-size="11.5" fill="#14132B" text-anchor="middle">sign-up flow, data fetching</text>

  <rect x="436" y="130" width="88" height="25" rx="12.5" fill="#FF3D9A"/>
  <text x="480" y="147" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">SHARED</text>

  <!-- fan-out to markets -->
  <line x1="340" y1="242" x2="140" y2="288" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="242" x2="340" y2="288" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="242" x2="540" y2="288" stroke="#14132B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- market packages -->
  <g>
    <rect x="55" y="290" width="170" height="82" rx="14" fill="#F4C9F3" stroke="#14132B" stroke-width="1.5"/>
    <text x="140" y="318" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14132B" text-anchor="middle">market-ca/</text>
    <text x="140" y="339" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">composes subcomponents</text>
    <text x="140" y="354" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">+ local copy</text>
    <rect x="185" y="282" width="36" height="21" rx="10.5" fill="#14132B"/>
    <text x="203" y="297" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">CA</text>
  </g>

  <g>
    <rect x="255" y="290" width="170" height="82" rx="14" fill="#F4C9F3" stroke="#14132B" stroke-width="1.5"/>
    <text x="340" y="318" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14132B" text-anchor="middle">market-au/</text>
    <text x="340" y="339" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">composes subcomponents</text>
    <text x="340" y="354" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">+ local copy</text>
    <rect x="385" y="282" width="36" height="21" rx="10.5" fill="#14132B"/>
    <text x="403" y="297" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">AU</text>
  </g>

  <g>
    <rect x="455" y="290" width="170" height="82" rx="14" fill="#F4C9F3" stroke="#14132B" stroke-width="1.5"/>
    <text x="540" y="318" font-family="Arial, sans-serif" font-size="13.5" font-weight="700" fill="#14132B" text-anchor="middle">market-uk/</text>
    <text x="540" y="339" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">composes subcomponents</text>
    <text x="540" y="354" font-family="Arial, sans-serif" font-size="10.5" fill="#14132B" text-anchor="middle">+ local copy</text>
